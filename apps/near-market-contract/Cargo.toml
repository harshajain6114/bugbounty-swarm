[package]
name = "bugbounty-swarm-market-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.6.0", features = ["legacy"] }
borsh = { version = "1.5.0", features = ["derive"] }
hex = "0.4.3"

[dev-dependencies]
near-sdk = { version = "5.6.0", features = ["legacy", "unit-testing"] }
hex = "0.4.3"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
